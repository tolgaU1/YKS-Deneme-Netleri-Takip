<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Takip — YKS Deneme Sonuçları</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#FFFFFF;
  --paper-deep:#F3F4F6;
  --card:#FFFFFF;
  --ink:#111827;
  --ink-soft:#6B7280;
  --line:#E5E7EB;
  --red:#DC2626;
  --green:#059669;
  --yellow:#D97706;
  --radius:14px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:#F5F6F8;
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}

/* header */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;}
.masthead h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-0.02em;margin:0;}
.masthead .barcode{display:flex;gap:2px;height:26px;align-items:flex-end;}
.masthead .barcode span{display:block;width:3px;background:var(--ink);}
.masthead .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;}
.settings-btn{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
  flex-shrink:0;
}
.settings-btn:hover{border-color:var(--ink);background:#F5F6F8;}
.head-right{display:flex;align-items:center;gap:14px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal-box{
  background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;
  box-shadow:0 20px 50px -20px rgba(17,24,39,.4);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.modal-head h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
.modal-close:hover{color:var(--ink);}
.modal-desc{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
.modal-box input[type="file"]{
  font-size:13px;width:100%;padding:9px;border:1.5px dashed var(--line);border-radius:9px;background:#F9FAFB;
}
.bg-preview{margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.bg-preview img{width:100%;height:120px;object-fit:cover;display:block;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions button{flex:1;}
.bg-warn{font-size:12px;color:var(--red);margin-top:8px;font-weight:600;}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  padding:9px 18px;border-radius:999px;border:2px solid var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;letter-spacing:.02em;
}
.tab-btn.active{background:var(--ink);color:var(--paper);}

/* form card */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(17,24,39,.03), 0 10px 22px -14px rgba(17,24,39,.14);
  padding:20px;
  margin-bottom:20px;
}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 14px;letter-spacing:-0.01em;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;color:var(--ink-soft);font-weight:600;}
.field input, .field select{
  font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:9px 10px;
  border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
}
.field input:focus, .field select:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}

.subject-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 0.9fr 0.9fr;gap:8px;align-items:center;margin-bottom:8px;}
.subject-grid.head{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.subject-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.subj-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.subject-grid input{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.readout{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);text-align:center;}
.readout.net{color:var(--green);font-weight:600;}

.btn-primary{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  background:var(--ink);color:var(--paper);border:none;border-radius:9px;
  padding:11px 20px;cursor:pointer;margin-top:6px;
}
.btn-primary:hover{background:#3a352c;}
.err{color:var(--red);font-size:12.5px;margin-top:6px;font-weight:600;}

/* entries */
.entry-list{display:flex;flex-direction:column;gap:12px;}
.entry{
  position:relative;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 16px 26px;overflow:hidden;
}
.entry::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
  background:repeating-linear-gradient(to bottom, var(--ink) 0 3px, transparent 3px 6px);
}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.entry-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;}
.entry-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.net-bubble{
  width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:'IBM Plex Mono',monospace;flex-shrink:0;background:#fff;
}
.net-bubble b{font-size:16px;line-height:1;}
.net-bubble span{font-size:8px;color:var(--ink-soft);letter-spacing:.03em;}
.bar-row{display:grid;grid-template-columns:100px 1fr 90px;gap:10px;align-items:center;margin-bottom:6px;}
.bar-row .lbl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.bar-track{height:12px;border-radius:6px;background:#e9e0c8;overflow:hidden;display:flex;border:1px solid var(--line);}
.seg-d{background:var(--green);}
.seg-y{background:var(--red);}
.seg-b{background:transparent;}
.bar-row .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);text-align:right;}
.del-btn{
  background:none;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:7px;
  font-size:11.5px;padding:4px 9px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
}
.del-btn:hover{border-color:var(--red);color:var(--red);}

.empty{
  text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;
  border:1.5px dashed var(--line);border-radius:var(--radius);
}

/* chart */
.chart-card canvas{width:100%!important;height:280px!important;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 11px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:6px;
}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--paper-deep);}

.section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;margin:26px 0 12px;}
.overview-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:18px;align-items:start;}
.overview-grid .chart-card{margin-top:0;position:sticky;top:16px;}
.overview-grid .chart-card canvas{height:240px!important;}
.legend-row{display:flex;gap:14px;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.legend-row span{display:flex;align-items:center;gap:6px;}
.btn-toggle{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;
  background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:9px;
  padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;
  justify-content:space-between;
}
.btn-toggle:hover{background:#F5F7FA;}
.btn-toggle .arrow{transition:transform .18s ease;font-size:12px;}
.btn-toggle.open .arrow{transform:rotate(180deg);}
.entry-list-panel{
  display:none;margin-top:10px;
  background:#F6F8FA;border:1px solid #E2E7EC;border-radius:var(--radius);
  padding:14px;
}
.entry-list-panel.open{display:block;}
.split-grid{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;}
.chip-col{display:flex;flex-direction:column;gap:6px;}
.chip-col .chip{width:100%;text-align:left;}
@media(max-width:640px){
  .split-grid{grid-template-columns:1fr;}
  .chip-col{flex-direction:row;flex-wrap:wrap;}
}
.chart-with-list{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start;margin-top:14px;}
.mini-list{
  max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px;
}
.mini-row{
  display:flex;flex-direction:column;gap:4px;
  padding:9px 10px;border-radius:8px;background:#F6F8FA;border:1px solid #E2E7EC;
}
.mini-row .m-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.mini-row .m-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.mini-row .m-net{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--green);flex-shrink:0;}
.mini-row .m-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
.mini-row .m-subjects{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;}
.m-subj{
  font-family:'IBM Plex Mono',monospace;font-size:10px;background:#EDEFF2;border-radius:5px;
  padding:2px 6px;color:var(--ink);white-space:nowrap;
}
.m-subj b{color:var(--ink-soft);font-weight:600;margin-right:3px;}
.mini-empty{font-size:12px;color:var(--ink-soft);padding:8px 4px;}
@media(max-width:640px){
  .chart-with-list{grid-template-columns:1fr;}
  .mini-list{max-height:220px;}
}
@media(max-width:800px){
  .overview-grid{grid-template-columns:1fr;}
  .overview-grid .chart-card{position:static;}
}
@media(max-width:640px){
  .form-row{grid-template-columns:1fr;}
  .subject-grid{grid-template-columns:1.1fr 0.8fr 0.8fr 0.8fr 0.8fr;font-size:12px;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const SUBJECTS = {
  tyt: [
    {ad:'Türkçe', soru:40},
    {ad:'Sosyal Bilimler', soru:20},
    {ad:'Matematik', soru:40},
    {ad:'Fen Bilimleri', soru:20},
  ],
  sayisal: [
    {ad:'Matematik', soru:40},
    {ad:'Fizik', soru:14},
    {ad:'Kimya', soru:13},
    {ad:'Biyoloji', soru:13},
  ],
  ea: [
    {ad:'Matematik', soru:40},
    {ad:'Edebiyat-Sosyal 1', soru:40},
  ],
  sozel: [
    {ad:'Sosyal Bilimler 2', soru:40},
    {ad:'Edebiyat-Sosyal 1', soru:40},
  ],
  dil: [
    {ad:'Yabancı Dil', soru:80},
  ],
};
const ALAN_LABEL = {sayisal:'Sayısal', ea:'Eşit Ağırlık', sozel:'Sözel', dil:'Dil'};
const STORAGE_KEY = 'yks-denemeler-v1';
const BG_STORAGE_KEY = 'yks-bg-image-v1';

const SUBJECT_COLORS = {
  'Türkçe':'#2563EB',
  'Sosyal Bilimler':'#7C3AED',
  'Matematik':'#DC2626',
  'Fen Bilimleri':'#059669',
  'Sosyal Bilimler 2':'#7C3AED',
  'Edebiyat-Sosyal 1':'#D97706',
  'Fizik':'#0891B2',
  'Kimya':'#DB2777',
  'Biyoloji':'#16A34A',
  'Yabancı Dil':'#9333EA',
};
function subjColor(ad){ return SUBJECT_COLORS[ad] || '#374151'; }

let state = {
  tab: 'tyt',            // 'tyt' | 'ayt'
  alan: 'sayisal',
  denemeler: [],
  loaded: false,
  chartSubjects: new Set(),
  chartInstance: null,
  overviewChartInstance: null,
  formErr: '',
  entriesOpen: false,
  settingsOpen: false,
  bgImage: null,
  bgErr: '',
};

function subjectsFor(tur, alan){ return tur === 'tyt' ? SUBJECTS.tyt : SUBJECTS[alan]; }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state.denemeler = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.denemeler = [];
  }
  state.loaded = true;
  render();
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.denemeler));
  }catch(e){
    console.error('Kayıt hatası', e);
  }
}

async function loadBg(){
  try{
    state.bgImage = localStorage.getItem(BG_STORAGE_KEY);
  }catch(e){
    state.bgImage = null;
  }
  applyBackground();
}

async function saveBg(dataUrl){
  try{
    if(dataUrl){
      localStorage.setItem(BG_STORAGE_KEY, dataUrl);
    } else {
      localStorage.removeItem(BG_STORAGE_KEY);
    }
  }catch(e){
    console.error('Arka plan kaydedilemedi', e);
    state.bgErr = 'Görsel bu tarayıcıda kaydedilemedi (çok büyük olabilir).';
  }
}

function applyBackground(){
  if(state.bgImage){
    document.body.style.backgroundImage = `linear-gradient(rgba(245,246,248,.87), rgba(245,246,248,.87)), url(${state.bgImage})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.style.backgroundRepeat = 'no-repeat';
  } else {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundAttachment = '';
    document.body.style.backgroundRepeat = '';
  }
}

function onBgFileChange(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 3 * 1024 * 1024){
    state.bgErr = 'Görsel çok büyük (max 3MB). Daha küçük bir görsel dene.';
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    state.bgImage = reader.result;
    state.bgErr = '';
    applyBackground();
    saveBg(state.bgImage);
    render();
  };
  reader.onerror = ()=>{
    state.bgErr = 'Görsel okunamadı, tekrar dene.';
    render();
  };
  reader.readAsDataURL(file);
}

function resetBg(){
  state.bgImage = null;
  state.bgErr = '';
  applyBackground();
  saveBg(null);
  render();
}

function fmt(n){
  const r = Math.round(n*100)/100;
  return (r>0?'+':'') + r.toFixed(2);
}

function computeEntryNet(subjects){
  return subjects.reduce((s,x)=> s + (x.d - x.y/4), 0);
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="empty">Yükleniyor…</div>`;
    return;
  }
  const activeSubjects = subjectsFor(state.tab, state.alan);
  const barcode = Array.from({length:26}).map(()=>`<span style="height:${8+Math.round(Math.random()*18)}px;width:${Math.random()>0.7?3:2}px"></span>`).join('');

  app.innerHTML = `
    <div class="masthead">
      <div>
        <div class="tag">YKS · Optik Değerlendirme</div>
        <h1>Net Takip</h1>
      </div>
      <div class="head-right">
        <div class="barcode">${barcode}</div>
        <button class="settings-btn" id="btn-settings" title="Görünüm ayarları">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>

    ${state.settingsOpen ? `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <div class="modal-head">
          <h2>Görünüm Ayarları</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <p class="modal-desc">Sitenin arka planına kendi görselini ekleyebilirsin.</p>
        <input type="file" accept="image/*" id="bg-file-input">
        ${state.bgErr ? `<div class="bg-warn">${state.bgErr}</div>` : ''}
        ${state.bgImage ? `<div class="bg-preview"><img src="${state.bgImage}"></div>` : ''}
        <div class="modal-actions">
          <button class="btn-toggle" id="btn-bg-reset">Varsayılana döndür</button>
        </div>
      </div>
    </div>` : ''}

    <div class="tabs">
      <button class="tab-btn ${state.tab==='tyt'?'active':''}" data-tab="tyt">TYT</button>
      <button class="tab-btn ${state.tab==='ayt'?'active':''}" data-tab="ayt">AYT</button>
    </div>

    <div class="card">
      <h2>Yeni deneme ekle</h2>
      <div class="form-row">
        <div class="field">
          <label>Deneme adı</label>
          <input type="text" id="f-ad" placeholder="Örn. 3D Yayınları Deneme 5">
        </div>
        <div class="field">
          <label>Tarih</label>
          <input type="date" id="f-tarih" value="${new Date().toISOString().slice(0,10)}">
        </div>
      </div>
      ${state.tab==='ayt' ? `
      <div class="form-row" style="grid-template-columns:1fr;">
        <div class="field">
          <label>Alan</label>
          <select id="f-alan">
            ${Object.keys(ALAN_LABEL).map(k=>`<option value="${k}" ${state.alan===k?'selected':''}>${ALAN_LABEL[k]}</option>`).join('')}
          </select>
        </div>
      </div>` : ''}

      <div class="subject-grid head">
        <div>Ders</div><div>Doğru</div><div>Yanlış</div><div>Boş</div><div>Net</div>
      </div>
      <div id="subject-inputs">
        ${activeSubjects.map((s,i)=>`
          <div class="subject-grid" data-idx="${i}">
            <div class="subject-name"><span class="subj-dot" style="background:${subjColor(s.ad)}"></span>${s.ad} <span style="color:var(--ink-soft);font-weight:400;">/ ${s.soru}</span></div>
            <input type="number" min="0" max="${s.soru}" class="inp-d" value="0">
            <input type="number" min="0" max="${s.soru}" class="inp-y" value="0">
            <div class="readout out-b">${s.soru}</div>
            <div class="readout net out-n">+0.00</div>
          </div>
        `).join('')}
      </div>
      ${state.formErr ? `<div class="err">${state.formErr}</div>` : ''}
      <button class="btn-primary" id="btn-add">Denemeyi kaydet</button>
    </div>

    <div class="section-title">Kayıtlı denemeler</div>
    <div class="overview-grid">
      <div>
        <button class="btn-toggle ${state.entriesOpen?'open':''}" id="btn-toggle-entries">
          <span>${state.entriesOpen ? 'Kayıtlı denemeleri gizle' : 'Kayıtlı denemeleri göster'}</span>
          <span class="arrow">▾</span>
        </button>
        <div class="entry-list-panel ${state.entriesOpen?'open':''}" id="entry-list-panel">
          <div class="entry-list" id="entry-list"></div>
        </div>
      </div>
      <div class="card chart-card">
        <h2 id="overview-title">Toplam net</h2>
        <div class="legend-row" id="overview-legend"></div>
        <canvas id="overview-chart"></canvas>
      </div>
    </div>

    <div class="card chart-card" style="margin-top:24px;">
      <h2>Net gelişimi</h2>
      <div class="chip-row" id="chip-row"></div>
      <div class="chart-with-list">
        <canvas id="net-chart"></canvas>
        <div class="mini-list" id="mini-list"></div>
      </div>
    </div>
  `;

  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; state.formErr=''; state.chartSubjects=new Set(); render(); };
  });
  const alanSel = document.getElementById('f-alan');
  if(alanSel) alanSel.onchange = (e)=>{ state.alan = e.target.value; state.formErr=''; render(); };

  document.querySelectorAll('#subject-inputs .subject-grid').forEach((row)=>{
    const idx = row.dataset.idx;
    const s = activeSubjects[idx];
    const dInp = row.querySelector('.inp-d');
    const yInp = row.querySelector('.inp-y');
    const bOut = row.querySelector('.out-b');
    const nOut = row.querySelector('.out-n');
    const update = ()=>{
      let d = parseInt(dInp.value)||0, y = parseInt(yInp.value)||0;
      if(d<0) d=0; if(y<0) y=0;
      if(d+y > s.soru){ y = Math.max(0, s.soru - d); yInp.value = y; }
      const bosh = s.soru - d - y;
      bOut.textContent = bosh;
      nOut.textContent = fmt(d - y/4);
    };
    dInp.oninput = update; yInp.oninput = update;
  });

  document.getElementById('btn-add').onclick = onAdd;
  document.getElementById('btn-toggle-entries').onclick = ()=>{
    state.entriesOpen = !state.entriesOpen;
    render();
  };

  document.getElementById('btn-settings').onclick = ()=>{
    state.settingsOpen = true;
    render();
  };
  const overlay = document.getElementById('modal-overlay');
  if(overlay){
    overlay.onclick = (e)=>{ if(e.target===overlay){ state.settingsOpen=false; state.bgErr=''; render(); } };
    document.getElementById('modal-close').onclick = ()=>{ state.settingsOpen=false; state.bgErr=''; render(); };
    document.getElementById('bg-file-input').onchange = onBgFileChange;
    document.getElementById('btn-bg-reset').onclick = resetBg;
  }

  renderEntries();
  renderOverviewChart();
  renderChart();
}

function renderOverviewChart(){
  const isT = state.tab === 'tyt';
  const color = isT ? '#24211D' : '#B23A28';
  const label = isT ? 'TYT' : 'AYT';

  document.getElementById('overview-title').textContent = label + ' toplam net';
  document.getElementById('overview-legend').innerHTML =
    `<span><span class="legend-dot" style="background:${color};"></span>${label}</span>`;

  const entries = state.denemeler
    .filter(e=> e.tur === state.tab)
    .sort((a,b)=>a.tarih.localeCompare(b.tarih));

  const ctx = document.getElementById('overview-chart');
  if(state.overviewChartInstance){ state.overviewChartInstance.destroy(); }
  if(entries.length===0){ return; }

  const labels = entries.map(e=> new Date(e.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}));
  const datasets = [{
    label,
    data: entries.map(e=> Math.round(e.toplamNet*100)/100),
    borderColor:color, backgroundColor:color,
    tension:0.25, pointRadius:4, borderWidth:2.5,
  }];

  state.overviewChartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ grid:{color:'#E5E7EB'}, ticks:{font:{family:'IBM Plex Mono', size:11}} },
        x:{ grid:{display:false}, ticks:{font:{family:'IBM Plex Mono', size:11}} },
      }
    }
  });
}

function onAdd(){
  const activeSubjects = subjectsFor(state.tab, state.alan);
  const ad = document.getElementById('f-ad').value.trim();
  const tarih = document.getElementById('f-tarih').value;
  if(!ad || !tarih){
    state.formErr = 'Deneme adı ve tarih gerekli.';
    render(); return;
  }
  const rows = document.querySelectorAll('#subject-inputs .subject-grid');
  const subjects = [];
  rows.forEach((row,i)=>{
    const s = activeSubjects[i];
    const d = parseInt(row.querySelector('.inp-d').value)||0;
    const y = parseInt(row.querySelector('.inp-y').value)||0;
    subjects.push({ad:s.ad, soru:s.soru, d, y});
  });
  const entry = {
    id: uid(),
    tur: state.tab,
    alan: state.tab==='ayt' ? state.alan : null,
    ad, tarih,
    subjects,
    toplamNet: computeEntryNet(subjects),
  };
  state.denemeler.push(entry);
  state.formErr = '';
  saveData();
  render();
}

function deleteEntry(id){
  state.denemeler = state.denemeler.filter(e=>e.id!==id);
  saveData();
  render();
}

function renderEntries(){
  const list = document.getElementById('entry-list');
  const filtered = state.denemeler
    .filter(e=> e.tur === state.tab && (state.tab==='tyt' || e.alan === state.alan))
    .sort((a,b)=> b.tarih.localeCompare(a.tarih));

  if(filtered.length===0){
    list.innerHTML = `<div class="empty">Henüz bu kategoride deneme yok. Formu doldurup ilk denemeni ekle.</div>`;
    return;
  }

  list.innerHTML = filtered.map(e=>{
    const maxNet = e.subjects.reduce((s,x)=>s+x.soru,0);
    return `
    <div class="entry">
      <div class="entry-top">
        <div>
          <div class="entry-title">${e.ad}</div>
          <div class="entry-meta">${new Date(e.tarih).toLocaleDateString('tr-TR', {day:'2-digit',month:'long',year:'numeric'})} · ${e.tur==='tyt'?'TYT':'AYT · '+ALAN_LABEL[e.alan]}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="net-bubble"><b>${fmt(e.toplamNet)}</b><span>NET</span></div>
          <button class="del-btn" onclick="deleteEntry('${e.id}')">Sil</button>
        </div>
      </div>
      ${e.subjects.map(s=>{
        const dPct = (s.d/s.soru*100).toFixed(1);
        const yPct = (s.y/s.soru*100).toFixed(1);
        return `
        <div class="bar-row">
          <div class="lbl"><span class="subj-dot" style="background:${subjColor(s.ad)}"></span>${s.ad}</div>
          <div class="bar-track">
            <div class="seg-d" style="width:${dPct}%"></div>
            <div class="seg-y" style="width:${yPct}%"></div>
          </div>
          <div class="num">D:${s.d} Y:${s.y} · ${fmt(s.d - s.y/4)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function renderChart(){
  const filtered = state.denemeler
    .filter(e=> e.tur === state.tab && (state.tab==='tyt' || e.alan === state.alan))
    .sort((a,b)=> a.tarih.localeCompare(b.tarih));

  const subjNames = subjectsFor(state.tab, state.alan).map(s=>s.ad);
  const chipRow = document.getElementById('chip-row');
  chipRow.innerHTML = `<button class="chip ${state.chartSubjects.size===0?'on':''}" id="chip-toplam">Toplam Net</button>` +
    subjNames.map(n=>`<button class="chip ${state.chartSubjects.has(n)?'on':''}" data-subj="${n}" style="${state.chartSubjects.has(n)?`border-color:${subjColor(n)};color:${subjColor(n)};background:${subjColor(n)}12;`:''}"><span class="subj-dot" style="background:${subjColor(n)}"></span>${n}</button>`).join('');

  document.getElementById('chip-toplam').onclick = ()=>{ state.chartSubjects=new Set(); renderChart(); };
  chipRow.querySelectorAll('[data-subj]').forEach(c=>{
    c.onclick = ()=>{
      const n = c.dataset.subj;
      if(state.chartSubjects.has(n)) state.chartSubjects.delete(n); else state.chartSubjects.add(n);
      renderChart();
    };
  });

  const ctx = document.getElementById('net-chart');
  if(state.chartInstance){ state.chartInstance.destroy(); }
  if(filtered.length===0){
    renderMiniList(filtered);
    return;
  }

  const labels = filtered.map(e=> new Date(e.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}));
  const denemeAdlari = filtered.map(e=> e.ad);

  let datasets;
  if(state.chartSubjects.size===0){
    datasets = [{
      label:'Toplam Net',
      data: filtered.map(e=>Math.round(e.toplamNet*100)/100),
      borderColor:'#111827', backgroundColor:'#111827',
      tension:0.25, pointRadius:4, pointBackgroundColor:'#111827', borderWidth:2.5,
    }];
  } else {
    datasets = Array.from(state.chartSubjects).map((n)=>({
      label:n,
      data: filtered.map(e=>{
        const s = e.subjects.find(x=>x.ad===n);
        return s ? Math.round((s.d - s.y/4)*100)/100 : null;
      }),
      borderColor: subjColor(n), backgroundColor: subjColor(n),
      tension:0.25, pointRadius:4, borderWidth:2.5,
    }));
  }

  state.chartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display: datasets.length>1, labels:{font:{family:'IBM Plex Sans'}} },
        tooltip:{
          callbacks:{
            title: (items)=> items.length ? denemeAdlari[items[0].dataIndex] : '',
            label: (item)=> `${item.dataset.label}: ${item.formattedValue}`,
          }
        }
      },
      scales:{
        y:{ grid:{color:'#E5E7EB'}, ticks:{font:{family:'IBM Plex Mono', size:11}} },
        x:{ grid:{display:false}, ticks:{font:{family:'IBM Plex Mono', size:11}} },
      }
    }
  });

  renderMiniList(filtered);
}

function subjAbbrev(ad){
  const first = ad.split(/[\s-]/)[0];
  return first.slice(0,3).toUpperCase();
}

function renderMiniList(filteredAsc){
  const box = document.getElementById('mini-list');
  if(!box) return;
  const list = [...filteredAsc].reverse();
  if(list.length===0){
    box.innerHTML = `<div class="mini-empty">Henüz deneme yok.</div>`;
    return;
  }
  box.innerHTML = list.map(e=>{
    const tarihStr = new Date(e.tarih).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const subjChips = e.subjects.map(s=>{
      const c = subjColor(s.ad);
      return `<span class="m-subj" style="color:${c};background:${c}15;border-color:${c}33;"><b style="color:${c};">${subjAbbrev(s.ad)}</b>${fmt(s.d - s.y/4)}</span>`;
    }).join('');
    return `
    <div class="mini-row" title="${e.ad}">
      <div class="m-top">
        <span class="m-name">${e.ad}</span>
        <span class="m-net">${fmt(e.toplamNet)}</span>
      </div>
      <div class="m-date">${tarihStr}</div>
      <div class="m-subjects">${subjChips}</div>
    </div>`;
  }).join('');
}

window.deleteEntry = deleteEntry;
loadData();
loadBg();
</script>
</body>
</html>
